name: Process Payment Webhook

on:
  repository_dispatch:
    types: [payment-complete]

jobs:
  update-purchases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
      - name: Update purchases database
        run: |
          # Read existing purchases.json
          PURCHASES=$(cat purchases.json)
          
          # Extract customer info from webhook payload
          EMAIL="${{ github.event.client_payload.email }}"
          ORDER_ID="${{ github.event.client_payload.order_id }}"
          DATE=$(date +%Y-%m-%d)
          
          # Add new purchase (using jq to properly handle JSON)
          NEW_PURCHASE="{\"email\":\"$EMAIL\",\"orderId\":\"$ORDER_ID\",\"date\":\"$DATE\"}"
          echo $PURCHASES | jq ".purchases += [$NEW_PURCHASE]" > purchases.json
          
      - name: Commit and push changes
        run: |
          git add purchases.json
          git commit -m "Add purchase: ${{ github.event.client_payload.email }} - ${{ github.event.client_payload.order_id }}"
          git push 